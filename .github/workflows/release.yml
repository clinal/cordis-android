name: Release

on:
  push:
    branches:
      - main
    paths:
      - boilerplate/packages/android/package.json

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check package version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          package_json=boilerplate/packages/android/package.json
          previous_package_json=$package_json
          if ! git cat-file -e "$BEFORE_SHA:$previous_package_json" 2>/dev/null; then
            previous_package_json=plugins/android/packages/android/package.json
          fi
          version=$(jq -r .version "$package_json")
          previous_version=$(git show "$BEFORE_SHA:$previous_package_json" | jq -r .version)

          node -e 'const v = process.argv[1]; if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(v)) process.exit(1)' "$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "$previous_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package.json changed without a version bump; skipping release"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "Tag v$version already exists" >&2
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

  npm:
    name: Publish npm package
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: boilerplate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Type-check
        run: yarn workspace cordis-plugin-android typecheck

      - name: Build
        run: yarn build

      - name: Publish
        run: npm publish ./packages/android --access public --provenance

  apk:
    name: Publish signed APK
    needs:
      - prepare
      - npm
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CORDIS_ANDROID_KEYSTORE_BASE64: ${{ secrets.CORDIS_ANDROID_KEYSTORE_BASE64 }}
      CORDIS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CORDIS_ANDROID_KEYSTORE_PASSWORD }}
      CORDIS_ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/ci-signing/cordis-ci.jks
      CORDIS_ANDROID_VERSION_CODE: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing configuration
        run: |
          test -n "$CORDIS_ANDROID_KEYSTORE_BASE64"
          test -n "$CORDIS_ANDROID_KEYSTORE_PASSWORD"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-on-droid.cachix.org
            extra-trusted-public-keys = nix-on-droid.cachix.org-1:56snoMJTXmDRC1Ei24CmKoUqvHJ9XCp+nidK7qkMQrU=

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost

      - name: Build bootstrap assets
        run: nix build ./bootstrap

      - name: Prepare CI signing key
        run: |
          mkdir -p "$(dirname "$CORDIS_ANDROID_KEYSTORE_FILE")"
          printf '%s' "$CORDIS_ANDROID_KEYSTORE_BASE64" | base64 -d > "$CORDIS_ANDROID_KEYSTORE_FILE"

      - name: Build signed release APK
        run: nix develop --command gradle -PcordisBootstrapAssetsDir=result --build-cache clean assembleRelease

      - name: Verify APK signature
        run: |
          # shellcheck disable=SC2016
          nix develop --command bash -c '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk'

      - name: Name release asset
        run: cp app/build/outputs/apk/release/app-release.apk "cordis-android-$RELEASE_VERSION.apk"

      - name: Create tag and GitHub release
        run: |
          gh release create "v$RELEASE_VERSION" \
            "cordis-android-$RELEASE_VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes
