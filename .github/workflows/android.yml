name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build bootstrap assets
        run: nix build ./bootstrap

      - name: Build debug APK
        run: nix develop --command gradle -PcordisBootstrapAssetsDir=result clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cordis-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
